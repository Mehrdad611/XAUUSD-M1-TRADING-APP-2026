name: Build XAUUSD M1 Trading APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v4


      - name: پیدا کردن فایل ZIP پروژه
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV


      - name: استخراج پروژه
        run: |
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted"


      - name: پیدا کردن پوشه اصلی برنامه
        run: |
          PACKAGE_FILE=$(find project \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          echo "package.json found:"
          echo "$PACKAGE_FILE"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_FILE")

          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

          echo "Application directory:"
          echo "$APP_DIR"


      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 
